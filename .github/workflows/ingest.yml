name: ingest

# Atualiza os dados das pools (DefiLlama + Nortoken on-chain) → Neon, a cada 20 minutos.
# Repo público → GitHub Actions ilimitado/grátis. Requer o secret DATABASE_URL (connection string do Neon).
on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch: {}

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Rodar ingestor
        run: pnpm -F @mazarifi/ingestor ingest
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
